name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Mirrors the compose defaults. The harness reads .env when it
    # exists and the process environment otherwise, so CI needs no
    # file -- but it does need these, or the DSN cannot be built.
    env:
      POSTGRES_DB: fga
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: password
      POSTGRES_PORT: 5432
      POSTGRES_USER: fga

    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The schema installs during initdb (vendored cel4postgres first,
      # then sql/) and the healthcheck selects cel.version() and
      # fga.version(), so --wait returns only once the database is up
      # AND installed. A broken script fails this step rather than
      # reaching the suite as a mysterious test failure. The OpenFGA
      # oracle gates on its own grpc health probe.
      - run: docker compose up -d --wait

      - name: Verify installed schema and oracle
        run: |
          psql "postgres://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 \
            -c "SELECT cel.version(), fga.version()" \
            -c "SELECT cel.evaluate('1 + 2 == 3', '{}', 'standard')"
          curl -fsS http://localhost:8080/healthz

      # Every script is idempotent (CREATE OR REPLACE, IF NOT
      # EXISTS), so re-running the by-hand install loop against the
      # live database is the upgrade path -- prove it on every run.
      - name: Idempotent reinstall
        run: |
          DB="postgres://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/$POSTGRES_DB"
          psql -v ON_ERROR_STOP=1 -q -f vendor/cel4postgres--*.sql "$DB"
          for f in sql/*.sql; do
            psql -v ON_ERROR_STOP=1 -q -f "$f" "$DB"
          done

      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50d2b87a # v6.0.0
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - run: go vet ./...

      # -json feeds the run-derived skip list and the conformance
      # report; confreport exits non-zero when any test failed, so
      # nothing is lost to the pipe. The imported upstream runners
      # (check, list_objects, list_users) run inside this same
      # invocation, list_users sub-asserts included.
      - name: Test
        run: |
          go test -count=1 -timeout 20m -json ./... |
            tee /tmp/gotest.json |
            go run ./internal/cmd/confreport
          go run ./internal/cmd/skipgen < /tmp/gotest.json

      - name: Dump database logs
        if: failure()
        run: docker compose logs --no-color

  # The release channels, proven on every run rather than only at
  # publish time: the all-in bundle initdb-installs on the bare
  # pinned image; the wrapped artifact installs through pg_tle via
  # CREATE EXTENSION; and the grants template actually separates
  # the two roles (a reader can check but not write).
  artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build artifacts
        run: ./scripts/build-release.sh

      - name: Install the bundle on a bare database
        run: |
          version=$(sed -n "s/^VALUES ('\([0-9][0-9.]*\)');$/\1/p" \
            sql/010_install.sql)
          image=$(sed -n \
            's/^ *image: \(postgres:[^ ]*\)$/\1/p' compose.yaml)
          init=/docker-entrypoint-initdb.d/install.sql
          docker run -d --rm --name relcheck \
            -e POSTGRES_DB=fga -e POSTGRES_USER=fga \
            -e POSTGRES_PASSWORD=pw \
            -v "$PWD/dist/fga4postgres--$version.sql:$init:ro" \
            "$image" >/dev/null
          got=
          for _ in $(seq 60); do
            got=$(docker exec relcheck psql -U fga -d fga -tAc \
              'SELECT fga.version()' 2>/dev/null) && break
            sleep 2
          done
          if [ "$got" != "$version" ]; then
            docker rm -f relcheck >/dev/null
            echo "expected $version, got '$got'" >&2
            exit 1
          fi

      - name: Verify the grants template separates the roles
        run: |
          docker exec relcheck psql -U fga -d fga \
            -v ON_ERROR_STOP=1 -c \
            'CREATE ROLE fga_reader NOLOGIN;
             CREATE ROLE fga_writer NOLOGIN;'
          docker exec -i relcheck psql -U fga -d fga \
            -v ON_ERROR_STOP=1 <sql/900_grants.sql
          docker exec relcheck psql -U fga -d fga \
            -v ON_ERROR_STOP=1 -tAc \
            "SET ROLE fga_reader; SELECT fga.version();"
          if docker exec relcheck psql -U fga -d fga -tAc \
            "SET ROLE fga_reader;
             SELECT fga.create_store('nope');" 2>/dev/null
          then
            echo "fga_reader was able to write" >&2
            exit 1
          fi
          docker exec relcheck psql -U fga -d fga \
            -v ON_ERROR_STOP=1 -tAc \
            "SET ROLE fga_writer;
             SELECT (fga.create_store('ok')).id;"
          docker rm -f relcheck >/dev/null

      - name: Install through pg_tle
        run: |
          version=$(sed -n "s/^VALUES ('\([0-9][0-9.]*\)');$/\1/p" \
            sql/010_install.sql)
          base=$(sed -n \
            's/^ *image: \(postgres:[^ ]*\)$/\1/p' compose.yaml)
          docker build -f docker/pg_tle.Dockerfile \
            --build-arg BASE_IMAGE="$base" -t pgtle .
          ./scripts/pgtle-wrap.sh fga4postgres "$version" \
            "dist/fga4postgres--$version.sql" >wrapped.sql
          docker run -d --rm --name tle \
            -e POSTGRES_DB=fga -e POSTGRES_USER=fga \
            -e POSTGRES_PASSWORD=pw \
            -v "$PWD/wrapped.sql:/wrapped.sql:ro" \
            pgtle -c shared_preload_libraries=pg_tle >/dev/null
          for _ in $(seq 60); do
            docker exec tle pg_isready -U fga -d fga -q \
              2>/dev/null && break
            sleep 2
          done
          docker exec tle psql -U fga -d fga -v ON_ERROR_STOP=1 \
            -c 'CREATE EXTENSION pg_tle;' \
            -f /wrapped.sql \
            -c 'CREATE EXTENSION fga4postgres;'
          got=$(docker exec tle psql -U fga -d fga -tAc \
            "SELECT extversion FROM pg_extension
             WHERE extname = 'fga4postgres'")
          docker rm -f tle >/dev/null
          if [ "$got" != "$version" ]; then
            echo "pg_extension says '$got', not $version" >&2
            exit 1
          fi
